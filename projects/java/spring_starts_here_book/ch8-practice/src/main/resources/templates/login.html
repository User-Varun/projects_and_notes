<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>

</head>
<body>
    <h1>Login</h1>
    <form action="/login" method="post">
       Name: <input type="text" name="name" />
       Password: <input type="text" name="password" />

       <button type="submit" >Login</button>
    </form>

    <p th:text="${message}"></p>
</body>
</html>
